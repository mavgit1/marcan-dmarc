# Monthly pull requests for the pinned actions (commit SHAs) and the Dockerfile's
# base images (digests) on the public repo. They land on GitHub only: a wanted
# update is made on Forgejo and reaches GitHub with the next release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
