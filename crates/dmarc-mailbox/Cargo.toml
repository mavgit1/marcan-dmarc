[package]
name = "dmarc-mailbox"
version.workspace = true
edition.workspace = true
license-file.workspace = true
publish.workspace = true
description = "Mailbox fetch pass and polling loop for DMARC aggregate report attachments"

[dependencies]
dmarc-parser = { path = "../dmarc-parser" }
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }
async-imap = { workspace = true }
async-native-tls = { workspace = true }
mail-parser = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
# Microsoft Graph: plain HTTPS requests and JSON, no Graph SDK. Both are
# already in the build through the server and dmarc-dns.
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The fake Graph server of `test-support`; already the server's HTTP framework.
axum = { workspace = true, optional = true }

[features]
# The scripted in-memory IMAP server, the fake Graph server and
# MailboxWorker::sync_with_fake_server, for the server's end-to-end import tests.
test-support = ["dep:axum"]

[dev-dependencies]
axum = { workspace = true }
flate2 = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
