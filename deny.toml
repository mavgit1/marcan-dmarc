# cargo-deny: which licenses, crates and sources the dependency tree may use.
# scripts/check.sh runs `cargo deny check licenses bans sources`; the advisories
# are cargo-audit's job there, and it takes its ignore list from the
# [advisories] section below (so a deliberate ignore is written down once).

[graph]
all-features = false

[advisories]
# Each ignore says why the advisory does not reach Marcan, or why it cannot be
# fixed yet. Drop the entry once the dependency moves on.
ignore = [
    # rsa 0.9 (Marvin attack: a timing side channel in RSA private-key
    # decryption; fixed in rsa 0.10.0, released 8 Nov 2026, not adopted
    # yet: too fresh, and a major API change). Marcan uses rsa only to generate
    # the Microsoft login's RSA-2048 key (dmarc-server's
    # accounts/certificate.rs) and never decrypts with it; the client
    # assertion is signed by ring. (sqlx-mysql lists it too, never compiled.)
    { id = "RUSTSEC-2023-0071", reason = "key generation only, never decryption; ring signs; rsa 0.10 not adopted yet" },
    # smartstring 1.0 is unmaintained. It comes in through ts-rs's `format`
    # feature (dprint formats the generated TypeScript bindings), enabled in
    # the crates' dev-dependencies only: built for `cargo test`, never into
    # the release binary; no request or report ever reaches it.
    { id = "RUSTSEC-2026-0249", reason = "ts-rs binding formatter, dev-dependency only; no maintained replacement upstream yet" },
    # libsqlite3-sys 0.30 bundles SQLite before 3.54 (CVE-2026-119375: a
    # database opened with a crafted `-wal` file of another page size can
    # return stale process memory). Marcan opens only its own database in its
    # own data directory; whoever can plant files there already has the
    # database and its secrets. The fix is libsqlite3-sys 0.39, which no sqlx
    # release allows yet (sqlx-sqlite 0.9.0 caps it below 0.38): drop this
    # once one does.
    { id = "RUSTSEC-2026-0459", reason = "only Marcan's own data directory is opened; no sqlx release allows the patched libsqlite3-sys yet" },
    # pin-utils 0.1 is unmaintained (a few lines of pinning macros, no known
    # flaw). It comes in through async-imap 0.11, which has no release
    # without it yet.
    { id = "RUSTSEC-2026-0441", reason = "via async-imap; no release without it yet" },
]

[licenses]
# The licenses the tree uses today, all compatible with distributing Marcan
# under the AGPLv3 (and the BCL on top). A new license fails the check until
# it is looked at and added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Mozilla's CA bundle as data (webpki-roots), not code.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Weak copyleft per file, compatible with the AGPL; only reached through
    # ts-rs's binding formatter (see the advisory ignore above).
    { allow = ["MPL-2.0"], crate = "smartstring" },
]

[licenses.private]
# The workspace crates are under the BCL (license-file = LICENSE), which no
# SPDX identifier names; they are `publish = false`, so they are skipped here.
ignore = true

[bans]
# Two versions of one crate cost build time, not correctness; shown, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates have no version; they are
# never published, so that is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
