# cargo-deny: which licenses, crates and sources the dependency tree may use.
# scripts/check.sh runs `cargo deny check licenses bans sources`; the advisories
# are cargo-audit's job there, and it takes its ignore list from the
# [advisories] section below (so a deliberate ignore is written down once).

[graph]
all-features = false

[advisories]
# Each ignore says why the advisory does not reach Marcan, or why it cannot be
# fixed yet. Drop the entry once the dependency moves on.
ignore = [
    # rsa 0.9 (Marvin attack, timing side channel; no fixed version exists).
    # Only in Cargo.lock because sqlx's macros list sqlx-mysql as an optional
    # dependency; Marcan enables SQLite alone, so rsa is never compiled
    # (`cargo tree -i rsa --target all` prints nothing).
    { id = "RUSTSEC-2023-0071", reason = "sqlx-mysql only, never compiled: Marcan uses SQLite" },
    # smartstring 1.0 is unmaintained. It comes in through ts-rs's `format`
    # feature (dprint formats the generated TypeScript bindings), which runs
    # in `cargo test` only; no request or report ever reaches it.
    { id = "RUSTSEC-2026-0249", reason = "ts-rs binding formatter only; no maintained replacement upstream yet" },
]

[licenses]
# The licenses the tree uses today, all compatible with distributing Marcan
# under the AGPLv3 (and the BCL on top). A new license fails the check until
# it is looked at and added here.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # Mozilla's CA bundle as data (webpki-roots), not code.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    # Weak copyleft per file, compatible with the AGPL; only reached through
    # ts-rs's binding formatter (see the advisory ignore above).
    { allow = ["MPL-2.0"], crate = "smartstring" },
]

[licenses.private]
# The workspace crates are under the BCL (license-file = LICENSE), which no
# SPDX identifier names; they are `publish = false`, so they are skipped here.
ignore = true

[bans]
# Two versions of one crate cost build time, not correctness; shown, not fatal.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between the workspace crates have no version; they are
# never published, so that is fine.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
