[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license-file = "LICENSE"
# Never on crates.io: the crates are one program, built from this repository.
publish = false
version = "0.2.1"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = { version = "0.42", features = ["serialize"] }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "macros",
    "migrate",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
thiserror = "2"
tempfile = "3"
anyhow = "1"
tracing = "0.1"
futures = "0.3"
mail-parser = "0.11"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.6", default-features = false, features = ["runtime-tokio"] }
# SMTP submission. native-tls, like IMAP: mail servers are checked against the
# same system trust store either way.
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "hostname",
    "smtp-transport",
    "tokio1",
    "tokio1-native-tls",
] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tower-http = { version = "0.6", features = ["trace"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ipnet = "2"
hickory-resolver = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
# Ed25519 for verifying operator keys (dmarc-server's license.rs); already in
# the build through rustls, so no new crate.
ring = { version = "0.17", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
moka = { version = "0.12", features = ["future"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
csv = "1.3"
ts-rs = { version = "12", features = ["chrono-impl", "format", "no-serde-warnings"] }

# A curated list from clippy's pedantic and nursery groups, not the groups: the lints
# whose fixes cannot change behaviour. check.sh runs clippy with -D warnings, so warn gates.
[workspace.lints.clippy]
redundant_closure_for_method_calls = "warn"
doc_markdown = "warn"
ignored_unit_patterns = "warn"
unreadable_literal = "warn"
use_self = "warn"
cast_lossless = "warn"
semicolon_if_nothing_returned = "warn"
needless_pass_by_value = "warn"
map_unwrap_or = "warn"
explicit_iter_loop = "warn"
derive_partial_eq_without_eq = "warn"
duration_suboptimal_units = "warn"
match_wildcard_for_single_variants = "warn"
doc_link_code = "warn"
manual_assert = "warn"
trivially_copy_pass_by_ref = "warn"
assigning_clones = "warn"
equatable_if_let = "warn"
manual_string_new = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
elidable_lifetime_names = "warn"
unnecessary_literal_bound = "warn"
implicit_clone = "warn"
ref_option = "warn"
bool_to_int_with_if = "warn"
inconsistent_struct_constructor = "warn"
needless_continue = "warn"

# Dependencies optimized in debug builds: a fast dev server at runtime, a slower first compile.
[profile.dev.package."*"]
opt-level = 2
