# Marcan + Caddy (automatic HTTPS) with basic auth. Guide: https://marcan.kaitiaki.tech/deployment
# Run from this directory:  cp .env.example .env  (edit it)  &&  docker compose up -d
services:
  marcan:
    image: ghcr.io/mavgit1/marcan:${MARCAN_VERSION:-0.2.1}
    # To run your own build instead, replace the line above with:  build: ..
    container_name: marcan-app
    restart: unless-stopped
    # Marcan finishes in-flight requests and stops its mailbox pass between
    # batches before exiting; Docker's default 10 s would cut that short.
    stop_grace_period: 30s
    volumes:
      # The database, in the named volume marcan_data (Docker creates it as
      # <project>_marcan_data, writable for the container's user; the project
      # is this directory's name by default). For a directory next to this file
      # instead, slower on Docker Desktop and some NAS filesystems, use
      #   - ./data:/data   after  mkdir -p data && sudo chown 10001:10001 data
      - marcan_data:/data
    networks:
      - marcan-net
    # No "ports:" on purpose. Marcan has no login of its own and must only be
    # reachable through Caddy over the internal network.

  caddy:
    image: caddy:2-alpine
    container_name: marcan-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      MARCAN_DOMAIN: "${MARCAN_DOMAIN:?set MARCAN_DOMAIN in .env (e.g. dmarc.example.com)}"
      MARCAN_USER: "${MARCAN_USER:?set MARCAN_USER in .env (the login name)}"
      MARCAN_PASSWORD_HASH: "${MARCAN_PASSWORD_HASH:?set MARCAN_PASSWORD_HASH in .env (see .env.example: caddy hash-password)}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - marcan
    networks:
      - marcan-net

volumes:
  marcan_data:
  caddy_data:
  caddy_config:

networks:
  marcan-net:
    driver: bridge
